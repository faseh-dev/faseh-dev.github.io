<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Amina, Be My Valentine ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: "Comic Sans MS", cursive;
    background: radial-gradient(circle at top, #ff9a9e, #fecfef);
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    background: white;
    padding: 40px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    position: relative;
    width: 360px;
}

h1 {
    color: #ff2e63;
    margin-bottom: 10px;
}

#countdown {
    font-size: 22px;
    color: #444;
    margin: 10px 0 20px;
}

button {
    padding: 12px 26px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    position: absolute;
}

#yesBtn {
    background: #ff2e63;
    color: white;
    left: 70px;
    top: 220px;
}

#yesBtn:hover {
    transform: scale(1.1);
}

#noBtn {
    background: #888;
    color: white;
    left: 200px;
    top: 220px;
}

#result {
    font-size: 24px;
    color: #ff2e63;
    margin-top: 20px;
}

.heart {
    position: fixed;
    font-size: 24px;
    animation: floatUp 4s linear infinite;
}

@keyframes floatUp {
    from { transform: translateY(100vh); opacity: 1; }
    to { transform: translateY(-10vh); opacity: 0; }
}

/* dialog */
.dialog {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    justify-content: center;
    align-items: center;
}

.dialog-box {
    background: white;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    animation: pop 0.4s ease;
}

@keyframes pop {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.firework {
    position: fixed;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    animation: explode 1s ease-out forwards;
}

@keyframes explode {
    to {
        transform: translate(var(--dx), var(--dy));
        opacity: 0;
    }
}
</style>
</head>

<body>

<!-- background music -->
<audio autoplay loop>
  <source src="https://cdn.pixabay.com/audio/2022/02/23/audio_d1718c6b9c.mp3" type="audio/mpeg">
</audio>

<div class="card">
    <h1>❤️ Amina ❤️</h1>
    <div id="countdown">Loading...</div>
    <p>Will you be my Valentine?</p>

    <button id="yesBtn">YES 😍</button>
    <button id="noBtn">NO 🙈</button>

    <div id="result"></div>
</div>

<!-- dialog -->
<div class="dialog" id="dialog">
  <div class="dialog-box">
    <h2>Yay Amina!! ❤️</h2>
    <p>You just made me the happiest person alive 💖</p>
    <button onclick="closeDialog()">Close</button>
  </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const result = document.getElementById("result");
const dialog = document.getElementById("dialog");

/* moving NO button */
noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 60);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

/* YES click */
yesBtn.addEventListener("click", () => {
    result.innerHTML = "She said YES!! 💕";
    dialog.style.display = "flex";
    hearts();
    fireworks();
});

/* countdown (5 second dramatic build) */
let c = 5;
const cd = document.getElementById("countdown");
const timer = setInterval(() => {
    cd.innerHTML = "Big question in " + c + "…";
    c--;
    if (c < 0) {
        clearInterval(timer);
        cd.innerHTML = "Here it comes 💌";
    }
}, 1000);

/* floating hearts */
function hearts() {
    setInterval(() => {
        const h = document.createElement("div");
        h.className = "heart";
        h.innerHTML = "❤️";
        h.style.left = Math.random()*100 + "vw";
        h.style.fontSize = (18+Math.random()*20)+"px";
        document.body.appendChild(h);
        setTimeout(()=>h.remove(),4000);
    }, 250);
}

/* fireworks */
function fireworks() {
    for (let i=0;i<80;i++) {
        const f = document.createElement("div");
        f.className = "firework";
        f.style.left = "50%";
        f.style.top = "50%";
        f.style.background = `hsl(${Math.random()*360},100%,50%)`;
        f.style.setProperty('--dx', (Math.random()-0.5)*400 + 'px');
        f.style.setProperty('--dy', (Math.random()-0.5)*400 + 'px');
        document.body.appendChild(f);
        setTimeout(()=>f.remove(),1000);
    }
}

function closeDialog(){
    dialog.style.display = "none";
}
</script>

</body>
</html>
