<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Amina ❤️ Be My Valentine</title>

<style>
* { box-sizing: border-box; }

body {
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family: "Poppins", sans-serif;
  background: linear-gradient(-45deg,#ff6b6b,#ff9a9e,#fad0c4,#ffd1ff);
  background-size: 400% 400%;
  animation: bg 12s ease infinite;
  display:flex;
  justify-content:center;
  align-items:center;
}

@keyframes bg {
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.card {
  background:white;
  width:380px;
  max-width:95vw;
  padding:35px;
  border-radius:24px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.25);
  position:relative;
}

h1 {
  margin:0;
  color:#ff2e63;
  font-size:28px;
}

#typeText {
  margin-top:10px;
  min-height:48px;
  font-size:18px;
  color:#444;
}

#countdown {
  font-size:20px;
  margin:12px 0;
  color:#ff2e63;
  font-weight:bold;
}

button {
  padding:12px 22px;
  border:none;
  border-radius:30px;
  font-size:17px;
  cursor:pointer;
  position:absolute;
  transition:.2s;
}

#yesBtn {
  background:#ff2e63;
  color:white;
  left:70px;
  top:230px;
}

#yesBtn:hover { transform:scale(1.12); }

const noBtn = document.getElementById("noBtn");
const card = document.querySelector(".card");

noBtn.addEventListener("mouseover", () => {
  const rect = card.getBoundingClientRect();

  const padding = 20;
  const maxX = rect.width - noBtn.offsetWidth - padding;
  const maxY = rect.height - noBtn.offsetHeight - padding;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
});


.musicBtn {
  position:absolute;
  right:10px;
  top:10px;
  font-size:12px;
  padding:6px 10px;
  border-radius:20px;
  background:#eee;
}

.dialog {
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.55);
}

.dialogBox {
  background:white;
  padding:30px;
  border-radius:20px;
  text-align:center;
  animation:pop .4s ease;
}

@keyframes pop {
  from{transform:scale(.5);opacity:0}
  to{transform:scale(1);opacity:1}
}

.floatHeart {
  position:fixed;
  font-size:22px;
  animation:floatUp 5s linear forwards;
}

@keyframes floatUp {
  from { transform:translateY(100vh); opacity:1; }
  to { transform:translateY(-10vh); opacity:0; }
}

.particle {
  position:fixed;
  width:7px;
  height:7px;
  border-radius:50%;
  animation:boom 1.2s ease-out forwards;
}

@keyframes boom {
  to {
    transform:translate(var(--dx),var(--dy));
    opacity:0;
  }
}
</style>
</head>

<body>

<audio id="music" loop>
<source src="https://cdn.pixabay.com/audio/2022/03/15/audio_c8c8a73467.mp3">
</audio>

<div class="card">
  <button class="musicBtn" onclick="toggleMusic()">🔊 Music</button>

  <h1>Amina ❤️</h1>
  <div id="typeText"></div>
  <div id="countdown"></div>

  <p>Will you be my Valentine?</p>

  <button id="yesBtn">YES 😍</button>
  <button id="noBtn">NO 🙈</button>
</div>

<div class="dialog" id="dialog">
  <div class="dialogBox">
    <h2>She said YES!! 💖</h2>
    <p>You just made my world brighter, Amina ✨</p>
    <button onclick="closeDialog()">Kiss accepted 😄</button>
  </div>
</div>

<script>
/* typewriter */
const text = "I have something special to ask you...";
let i=0;
function type(){
  if(i<text.length){
    document.getElementById("typeText").innerHTML += text[i];
    i++;
    setTimeout(type,50);
  }
}
type();

/* countdown reveal */
let c=5;
const cd = document.getElementById("countdown");
const t=setInterval(()=>{
  cd.innerHTML="Preparing courage... "+c;
  c--;
  if(c<0){clearInterval(t); cd.innerHTML="Okay here goes 💌";}
},1000);

/* runaway NO */
const noBtn=document.getElementById("noBtn");
let tease = [
  "Nice try 😄",
  "Nope nope nope",
  "You can't press this",
  "Only YES works 😌",
  "Destiny says YES"
];

noBtn.addEventListener("mouseover",()=>{
  noBtn.innerText = tease[Math.floor(Math.random()*tease.length)];
  noBtn.style.left=Math.random()*(window.innerWidth-120)+"px";
  noBtn.style.top=Math.random()*(window.innerHeight-80)+"px";
});

/* YES click */
document.getElementById("yesBtn").onclick=()=>{
  document.getElementById("dialog").style.display="flex";
  hearts();
  fireworksBurst();
};

/* floating hearts */
function hearts(){
  setInterval(()=>{
    const h=document.createElement("div");
    h.className="floatHeart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"vw";
    h.style.fontSize=(18+Math.random()*26)+"px";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),5000);
  },200);
}

/* fireworks */
function fireworksBurst(){
  for(let j=0;j<5;j++){
    setTimeout(()=>{
      for(let i=0;i<70;i++){
        const p=document.createElement("div");
        p.className="particle";
        p.style.left="50%";
        p.style.top="50%";
        p.style.background=`hsl(${Math.random()*360},100%,50%)`;
        p.style.setProperty('--dx',(Math.random()-.5)*500+'px');
        p.style.setProperty('--dy',(Math.random()-.5)*500+'px');
        document.body.appendChild(p);
        setTimeout(()=>p.remove(),1200);
      }
    }, j*300);
  }
}

/* dialog */
function closeDialog(){
  document.getElementById("dialog").style.display="none";
}

/* music toggle (mobile safe) */
const music=document.getElementById("music");
function toggleMusic(){
  if(music.paused){ music.play(); }
  else { music.pause(); }
}
</script>

</body>
</html>
