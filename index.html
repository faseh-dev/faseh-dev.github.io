<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Amina ❤️</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(135deg,#ff9a9e,#fad0c4);
  font-family: Arial, sans-serif;
  overflow:hidden;
}

.card{
  background:white;
  padding:30px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  position:relative;
  width:340px;
}

h1{
  color:#ff4d6d;
}

button{
  padding:12px 22px;
  border:none;
  border-radius:30px;
  font-size:16px;
  cursor:pointer;
  transition:.25s;
}

#yesBtn{
  background:#ff4d6d;
  color:white;
}

#yesBtn:hover{
  transform:scale(1.1);
}

#noBtn{
  background:#ddd;
}

.questionBlock{
  display:none;
  animation:fadeIn .6s ease forwards;
}

.btnRow{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-top:18px;
  height:60px;
  position:relative;
}

.heart{
  position:fixed;
  font-size:20px;
  animation:fall linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(100vh);
    opacity:0;
  }
}

@keyframes fadeIn{
  from{opacity:0; transform:scale(.8);}
  to{opacity:1; transform:scale(1);}
}

#countdown{
  font-size:26px;
  margin:15px 0;
  color:#ff4d6d;
  font-weight:bold;
}

#yesImage{
  display:none;
  margin-top:15px;
  width:100%;
  border-radius:14px;
}
</style>
</head>

<body>

<div class="card">
  <h1>Hey Amina 💖</h1>
  <p>Something special is coming...</p>

  <div id="countdown">3</div>

  <div id="questionBlock" class="questionBlock">
    <p>Will you be my Valentine? 🌹</p>

    <div class="btnRow">
      <button id="yesBtn">YES 😍</button>
      <button id="noBtn">NO 🙈</button>
    </div>
  </div>

  <!-- Replace this image with your own -->
  <img id="yesImage" src="amina.jpg">

</div>

<!-- Optional music -->
<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
/* ---------------- Countdown ---------------- */

let count = 3;
const cd = document.getElementById("countdown");
const questionBlock = document.getElementById("questionBlock");

const timer = setInterval(()=>{
  count--;
  if(count === 0){
    clearInterval(timer);
    cd.style.display="none";
    questionBlock.style.display="block";
  } else {
    cd.textContent = count;
  }
},1000);

/* ---------------- Hearts ---------------- */

function makeHeart(){
  const h = document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(2+Math.random()*3)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),5000);
}
setInterval(makeHeart,400);

/* ---------------- Fireworks ---------------- */

function fireworks(){
  for(let i=0;i<25;i++){
    setTimeout(()=>{
      makeHeart();
    }, i*60);
  }
}

/* ---------------- Buttons ---------------- */

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const img = document.getElementById("yesImage");
const music = document.getElementById("bgMusic");

yesBtn.onclick = ()=>{
  fireworks();
  alert("YAY!! Best choice ever 😍💞");
  img.style.display="block";
  music.play().catch(()=>{});
};

/* NO button slips away but stays visible */

noBtn.addEventListener("mouseover", ()=>{
  const x = (Math.random()-0.5)*140;
  const y = (Math.random()-0.5)*80;
  noBtn.style.transform = `translate(${x}px, ${y}px)`;
});
</script>

</body>
</html>
