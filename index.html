<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>❤️ For Amina ❤️</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#ff9a9e,#fecfef);
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.card{
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  width:340px;
  z-index:2;
}

h1{color:#ff2e63;margin-bottom:10px;}

.buttons{
  margin-top:20px;
  display:flex;
  justify-content:center;
  gap:20px;
  position:relative;
}

button{
  padding:14px 28px;
  border:none;
  border-radius:30px;
  font-size:18px;
  cursor:pointer;
  transition:.2s;
}

#yesBtn{
  background:#ff2e63;
  color:white;
}

#noBtn{
  background:#888;
  color:white;
  position:relative;
}

#countdown{
  font-size:28px;
  margin:15px 0;
  color:#ff2e63;
}

#question{display:none;font-size:20px;margin-top:10px;}

#yesImage{
  display:none;
  margin-top:15px;
  width:100%;
  border-radius:15px;
}

#finalMsg{
  display:none;
  color:#ff2e63;
  margin-top:15px;
  font-size:18px;
}

/* falling roses */
.rose{
  position:fixed;
  top:-20px;
  font-size:22px;
  animation:fall linear forwards;
}

@keyframes fall{
  to{transform:translateY(110vh);}
}

/* fireworks */
.firework{
  position:fixed;
  font-size:24px;
  animation:pop 1s ease-out forwards;
}

@keyframes pop{
  0%{transform:scale(.2);opacity:1;}
  100%{transform:scale(2);opacity:0;}
}

</style>
</head>

<body>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="card">

<h1>❤️ Amina ❤️</h1>

<p id="typeText"></p>

<div id="countdown">3</div>

<div id="question">Will you be my Valentine? 💌</div>

<div class="buttons" id="btnRow" style="display:none">
  <button id="yesBtn" onclick="yesClicked()">YES 😍</button>
  <button id="noBtn">NO 🙈</button>
</div>

<img id="yesImage" src="amina.jpg">
<div id="finalMsg">You just made me the luckiest person alive ❤️</div>

</div>

<script>

/* ---------- TYPEWRITER MESSAGE ---------- */

const msg = "I have something very special to ask you...";
let ti = 0;
function typeWriter(){
  if(ti < msg.length){
    document.getElementById("typeText").innerHTML += msg.charAt(ti);
    ti++;
    setTimeout(typeWriter,40);
  }
}
typeWriter();

/* ---------- COUNTDOWN ---------- */

let c = 3;
const cd = document.getElementById("countdown");

const timer = setInterval(()=>{
  c--;
  cd.innerText = c;
  if(c==0){
    clearInterval(timer);
    cd.innerText = "💖";
    document.getElementById("question").style.display="block";
    document.getElementById("btnRow").style.display="flex";
  }
},1000);

/* ---------- NO BUTTON SLIP ---------- */

const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseenter", moveNo);
noBtn.addEventListener("click", moveNo);

function moveNo(){
  const pad = 20;
  const w = window.innerWidth - noBtn.offsetWidth - pad;
  const h = window.innerHeight - noBtn.offsetHeight - pad;

  noBtn.style.position="fixed";
  noBtn.style.left = Math.random()*w + "px";
  noBtn.style.top = Math.random()*h + "px";
}

/* ---------- YES CLICK ---------- */

function yesClicked(){

  document.getElementById("bgMusic").play().catch(()=>{});

  alert("Wait… are you really saying YES? 😳");
  setTimeout(()=>{
    alert("This just made my whole year ❤️");
  },800);
  setTimeout(()=>{
    alert("Okay then… officially asking 💍");
    showFireworks();
    document.getElementById("yesImage").style.display="block";
    document.getElementById("finalMsg").style.display="block";
  },1600);
}

/* ---------- ROSES ---------- */

setInterval(()=>{
  const r=document.createElement("div");
  r.className="rose";
  r.innerHTML="🌹";
  r.style.left=Math.random()*100+"vw";
  r.style.animationDuration=(3+Math.random()*3)+"s";
  document.body.appendChild(r);
  setTimeout(()=>r.remove(),6000);
},500);

/* ---------- FIREWORKS ---------- */

function showFireworks(){
  for(let i=0;i<25;i++){
    const f=document.createElement("div");
    f.className="firework";
    f.innerHTML="✨";
    f.style.left=Math.random()*100+"vw";
    f.style.top=Math.random()*100+"vh";
    document.body.appendChild(f);
    setTimeout(()=>f.remove(),1000);
  }
}

</script>

</body>
</html>
